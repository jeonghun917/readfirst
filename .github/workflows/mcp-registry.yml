# Lists the current server.json version in the official MCP Registry as io.github.jeonghun917/readfirst. Runs when a
# release is published (and by hand). The Registry checks that the npm package has that version, and a fresh npm publish
# takes a little while to show, so it waits for npm first. Logs in with this workflow's GitHub OIDC token: no secret.
name: mcp-registry
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    # Only CLI releases (vX.Y.Z): a plugin release (readfirst@X.Y.Z) on the same commit published the same version first,
    # and the CLI release then failed as a duplicate (v0.23.0, 2026-11-07).
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - name: Wait until npm has this version
        run: |
          v=$(node -p "require('./server.json').version")
          for i in $(seq 1 40); do
            if [ "$(npm view "readfirst@$v" version 2>/dev/null)" = "$v" ]; then echo "npm has $v"; exit 0; fi
            sleep 15
          done
          echo "npm still does not list readfirst@$v after 10 minutes"; exit 1
      - name: Publish server.json
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          curl --fail --location --silent --show-error --output mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          # A version the Registry already lists is done, not a failure (a re-run, or v0.22.1 tagged on a commit whose
          # server.json still named the version before it).
          for i in 1 2 3; do
            if out=$(./mcp-publisher publish 2>&1); then echo "$out"; exit 0; fi
            echo "$out"
            if echo "$out" | grep -q 'cannot publish duplicate version'; then echo "already listed"; exit 0; fi
            sleep 30
          done
          exit 1
