# Closes low-effort PRs from outside the project (peakoss/anti-slop). Owners, members and collaborators are exempt.
# Runs on pull_request_target so it can comment on fork PRs; it never checks out or runs the PR's code.
name: pr-quality
on:
  pull_request_target:
    types: [opened, reopened]
permissions:
  contents: read
  issues: read
  pull-requests: write
jobs:
  anti-slop:
    runs-on: ubuntu-latest
    steps:
      # v0.3.0, pinned by commit.
      - uses: peakoss/anti-slop@57858eead489d08b255fab2af45a506c2ca6eab2
        with:
          max-failures: 4
          # The defaults plus our own GitHub App, whose map PRs would otherwise be closed as slop.
          exempt-bots: |
            actions-user
            autofix-ci[bot]
            dependabot[bot]
            renovate[bot]
            github-actions[bot]
            readfirst-app[bot]
          failure-pr-message: |
            Thanks for the PR. It was closed automatically because it tripped several of our quality checks
            (see the job log). If this is a real fix or feature, please open an issue first describing the problem,
            then reopen the PR and link it.
