# Publishes readfirst to npm when a version tag (v0.1.0, ...) is pushed. Needs the repository secret NPM_TOKEN (an npm
# granular access token with publish rights for the readfirst package). mcp-registry.yml lists the version in the MCP
# Registry once npm has it.
name: release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test
      - name: Tag matches package.json
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          test "v$(node -p "require('./server.json').version")" = "$GITHUB_REF_NAME"
          test "v$(node -p "require('./server.json').packages[0].version")" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
