# No AI signatures in a pull request's title, description or commits, or in commits pushed to main (CLAUDE.md).
# Its own workflow so it runs again when the description is edited: the GitHub tools add a footer when they create a PR.
# On "opened" the script waits 30 s and reads the title and description as they are then (no-ai-signature.mjs).
name: signatures
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  signatures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: node .claude/hooks/no-ai-signature.mjs ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
