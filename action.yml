name: readfirst map check
description: Comments on each PR with the rules, risks and checks for its changed files, and fails when the map falls behind.
author: jeonghun917
branding:
  icon: book-open
  color: blue
inputs:
  token:
    description: Token used to read the PR's files and write the comment (needs pull-requests write).
    default: ${{ github.token }}
  comment:
    description: Post or update the PR comment ("false" only writes the job summary).
    default: 'true'
  fail-on-map-problems:
    description: Fail the check when .readfirst/map.json has problems `readfirst fix` cannot settle (new files beside placed ones are settled and pass).
    default: 'true'
  strict:
    description: '"true" also fails when new files are only placed by their neighbours, not yet written in the map.'
    default: 'false'
  auto-fix:
    description: '"true" commits what `readfirst fix` settles (new files placed by their neighbours) to the PR branch. Needs contents write. Not on PRs from forks.'
    default: 'false'
  limit:
    description: Most tests and users listed per section; empty (the default) lists them all.
    default: ''
runs:
  using: composite
  steps:
    # A self-hosted runner may have no Node: say so instead of failing with "node: command not found".
    - shell: bash
      run: |
        command -v node >/dev/null || { echo "::error::readfirst needs Node 20 or newer on the runner: add actions/setup-node before this step"; exit 1; }
        node "$GITHUB_ACTION_PATH/src/action.mjs"
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_FAIL_ON_MAP_PROBLEMS: ${{ inputs.fail-on-map-problems }}
        INPUT_LIMIT: ${{ inputs.limit }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_AUTO_FIX: ${{ inputs.auto-fix }}
